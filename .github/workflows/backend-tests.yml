name: Backend Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pfm
          POSTGRES_PASSWORD: pfm
          POSTGRES_DB: finance_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pfm -d finance_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://pfm:pfm@localhost:5432/finance_manager_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Check migrations match the models
        env:
          DATABASE_URL: postgresql+psycopg://pfm:pfm@localhost:5432/finance_manager_test
          JWT_SECRET: ci-only-secret
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base

      - name: Run backend tests
        run: python -m pytest -v
